name: Instalátory

# Build se spustí označením verze (`git tag v1.0.1 && git push --tags`)
# nebo ručně tlačítkem v záložce Actions. Stejná značka spustí i sestavení
# pro iOS, takže jedním tagem vznikne instalátor pro macOS i .ipa.
#
# Windows se od 18. 11. 2026 nesestavuje — není potřeba (rozhodnutí
# Patrika). Skript `npm run dist:win` zůstává; kdyby byl Windows potřeba,
# stačí do matice vrátit položku s `windows-2022` (viz historie souboru).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Nový tag zruší rozdělaný běh nad tím samým tagem — ať se neplýtvá minutami
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Když spadne jedna platforma, druhá má doběhnout — ať je vidět,
      # jestli je problém obecný, nebo jen v jednom systému
      fail-fast: false
      matrix:
        include:
          # Runner je Apple Silicon → odpovídá `mac.arch: [arm64]`.
          # Dřív `macos-14`, jenže ten GitHub k 1. 10. 2026 vyřadil a sestavení
          # pro Mac skončilo hned na startu hláškou „The configuration
          # 'macos-14-arm64-us-default' is not supported". `macos-15` je také
          # Apple Silicon a stejný běžec používá sestavení pro iOS.
          - os: macos-15
            label: macOS arm64
            script: dist:mac
            artifact: macos-arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Schválně 3.11, ne novější. node-gyp 9 (nese ho electron-builder přes
      # @electron/rebuild) importuje modul `distutils`, který byl z Pythonu 3.12
      # odstraněn. Bez tohohle kroku by kompilace better-sqlite3 spadla na
      # `ModuleNotFoundError: No module named 'distutils'`.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Verze podle značky — electron-builder ji bere z package.json a promítne
      # se do názvu instalátoru i do „O aplikaci"
      - name: Verze podle značky
        run: node scripts/set-version.mjs

      - name: Instalace závislostí
        run: npm ci

      - name: Sestavení instalátoru
        run: npm run ${{ matrix.script }}
        env:
          # Runner nemá v keychainu žádný certifikát. Bez tohohle by se
          # electron-builder pokoušel podpisovou identitu hledat a spadl by.
          # Až budou certifikáty v Secrets, řádek se smaže — viz BUILD.md.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Uložení výsledku
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 30
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip

  release:
    name: Vydání
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: instalatory
          merge-multiple: true

      # Stejnou značkou běží i sestavení pro iOS, takže vydání už může
      # existovat — pak se do něj jen přiloží instalátory.
      - name: Vytvoření vydání
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          for pokus in 1 2 3; do
            if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release upload "$GITHUB_REF_NAME" instalatory/* --repo "$GITHUB_REPOSITORY" --clobber
            else
              gh release create "$GITHUB_REF_NAME" instalatory/* \
                --repo "$GITHUB_REPOSITORY" \
                --title "Quentino App $GITHUB_REF_NAME" \
                --notes "Instalátor pro macOS a .ipa sestavené automaticky."
            fi
            if [ $? -eq 0 ]; then echo "Hotovo."; exit 0; fi
            echo "Pokus $pokus selhal, čekám 20 s…"
            sleep 20
          done
          exit 1
