name: Instalátory

# Build se spustí označením verze (`git tag v1.0.1 && git push --tags`)
# nebo ručně tlačítkem v záložce Actions. Stejná značka spustí i sestavení
# pro iOS, takže jedním tagem vznikne instalátor pro Windows, macOS i .ipa.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Nový tag zruší rozdělaný běh nad tím samým tagem — ať se neplýtvá minutami
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Když spadne jedna platforma, druhá má doběhnout — ať je vidět,
      # jestli je problém obecný, nebo jen v jednom systému
      fail-fast: false
      matrix:
        include:
          # Schválně `windows-2022`, ne `windows-latest`. Ten má dnes Visual
          # Studio 2026 (verze 18) a node-gyp 9 — který si přes @electron/rebuild
          # nese electron-builder — ho neumí rozpoznat: zná jen VS 2013 až 2022
          # a spadne na „Could not find any Visual Studio installation to use".
          # Až electron-builder povýší node-gyp, dá se vrátit na windows-latest.
          # Runner je x64, takže odpovídá `win.arch: [x64]`.
          - os: windows-2022
            label: Windows x64
            script: dist:win
            artifact: windows-x64
          - os: macos-14         # runner je Apple Silicon → odpovídá `mac.arch: [arm64]`
            label: macOS arm64
            script: dist:mac
            artifact: macos-arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Schválně 3.11, ne novější. node-gyp 9 (nese ho electron-builder přes
      # @electron/rebuild) importuje modul `distutils`, který byl z Pythonu 3.12
      # odstraněn. Bez tohohle kroku by kompilace better-sqlite3 spadla na
      # `ModuleNotFoundError: No module named 'distutils'`.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Verze podle značky — electron-builder ji bere z package.json a promítne
      # se do názvu instalátoru i do „O aplikaci"
      - name: Verze podle značky
        run: node scripts/set-version.mjs

      - name: Instalace závislostí
        run: npm ci

      - name: Sestavení instalátoru
        run: npm run ${{ matrix.script }}
        env:
          # Runner nemá v keychainu žádný certifikát. Bez tohohle by se
          # electron-builder pokoušel podpisovou identitu hledat a spadl by.
          # Až budou certifikáty v Secrets, řádek se smaže — viz BUILD.md.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Uložení výsledku
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 30
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip

  release:
    name: Vydání
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: instalatory
          merge-multiple: true

      # Stejnou značkou běží i sestavení pro iOS, takže vydání už může
      # existovat — pak se do něj jen přiloží instalátory.
      - name: Vytvoření vydání
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          for pokus in 1 2 3; do
            if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release upload "$GITHUB_REF_NAME" instalatory/* --repo "$GITHUB_REPOSITORY" --clobber
            else
              gh release create "$GITHUB_REF_NAME" instalatory/* \
                --repo "$GITHUB_REPOSITORY" \
                --title "Quentino App $GITHUB_REF_NAME" \
                --notes "Instalátory a .ipa sestavené automaticky. Windows verze je nepodepsaná — SmartScreen ohlásí varování, je potřeba kliknout na *Více informací → Přesto spustit*."
            fi
            if [ $? -eq 0 ]; then echo "Hotovo."; exit 0; fi
            echo "Pokus $pokus selhal, čekám 20 s…"
            sleep 20
          done
          exit 1
