# Sestavení .ipa pro SideStore.
#
# Zkopíruj do .github/workflows/ios-release.yml (soubory ve workflows se přes
# vzdálené nástroje zapisovat nedají, musí je uložit člověk).
#
# Aplikace se vědomě NEPODEPISUJE — podpis dělá SideStore certifikátem
# konkrétního uživatele. Proto stačí `CODE_SIGNING_ALLOWED=NO` a .ipa se
# poskládá ručně ze složky Payload.

name: iOS

on:
  push:
    tags: ['ios-v*']
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 1) Rozhraní — tentýž React, jaký běží na počítači.
      #    Nativní moduly Electronu se sem netahají: pro .ipa jsou k ničemu
      #    a jejich přestavba na runneru padá na Pythonu bez distutils.
      - name: Sestavení rozhraní
        env:
          QUENTINO_SKIP_NATIVE: '1'
        run: |
          npm ci --ignore-scripts
          npx vite build
          rm -rf ios/QuentinoApp/Resources/renderer
          mkdir -p ios/QuentinoApp/Resources/renderer
          cp -R dist/renderer/. ios/QuentinoApp/Resources/renderer/

      # 2) Projekt pro Xcode se generuje, v gitu není
      - name: Příprava projektu
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Sestavení aplikace
        run: |
          cd ios
          set -o pipefail
          xcodebuild \
            -project QuentinoApp.xcodeproj \
            -scheme QuentinoApp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Zabalení .ipa
        run: |
          cd ios/build/Build/Products/Release-iphoneos
          mkdir -p Payload
          cp -R QuentinoApp.app Payload/
          zip -qry "$GITHUB_WORKSPACE/QuentinoApp.ipa" Payload
          ls -lh "$GITHUB_WORKSPACE/QuentinoApp.ipa"

      - name: Zdroj pro SideStore
        env:
          TARGET_REPO: ${{ vars.RELEASE_REPO || github.repository }}
        run: node ios/ci/make-source.mjs QuentinoApp.ipa apps.json

      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: |
            QuentinoApp.ipa
            apps.json
          if-no-files-found: error
          retention-days: 30

      # 3) Vydání do VEŘEJNÉHO repozitáře — SideStore musí .ipa stáhnout
      #    bez přihlášení, takže z privátního repozitáře to nejde.
      - name: Vydání
        if: startsWith(github.ref, 'refs/tags/ios-v')
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          TARGET_REPO: ${{ vars.RELEASE_REPO || github.repository }}
        run: |
          set +e
          for pokus in 1 2 3; do
            if gh release view "$GITHUB_REF_NAME" --repo "$TARGET_REPO" >/dev/null 2>&1; then
              gh release upload "$GITHUB_REF_NAME" QuentinoApp.ipa apps.json --repo "$TARGET_REPO" --clobber
            else
              gh release create "$GITHUB_REF_NAME" QuentinoApp.ipa apps.json \
                --repo "$TARGET_REPO" \
                --title "Quentino App $GITHUB_REF_NAME" \
                --notes "Nepodepsané .ipa pro SideStore. Zdroj pro SideStore je apps.json ve stejném vydání."
            fi
            if [ $? -eq 0 ]; then echo "Hotovo."; exit 0; fi
            echo "Pokus $pokus selhal, čekám 30 s…"
            sleep 30
          done
          exit 1
