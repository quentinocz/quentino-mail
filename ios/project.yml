# Projekt pro XcodeGen — .xcodeproj se generuje, nedrží se v gitu.
# Xcode projekty jsou v gitu zdrojem konfliktů a v CI se stejně vytvoří znovu.
name: QuentinoApp
options:
  bundleIdPrefix: cz.quentino
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    # Podpis se nedělá v CI — .ipa je nepodepsané a podepíše si ho až SideStore
    # certifikátem konkrétního uživatele.
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGN_ENTITLEMENTS: ""

targets:
  QuentinoApp:
    type: application
    platform: iOS
    # iPhone i iPad (řídí TARGETED_DEVICE_FAMILY níž)
    sources:
      # Swift kód
      - path: QuentinoApp
        excludes:
          - "Resources/**"
      # Sestavené rozhraní jako složka — v balíčku zůstane struktura souborů,
      # takže si ji vlastní schéma quentino:// umí naservírovat
      - path: QuentinoApp/Resources/renderer
        type: folder
      # Ikona aplikace; katalog se překládá do Assets.car
      - path: QuentinoApp/Resources/Assets.xcassets
    info:
      path: QuentinoApp/Info.plist
      properties:
        CFBundleDisplayName: Quentino App
        # Bez tohohle klíče systém ikonu z katalogu nenajde a plocha zůstane prázdná
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Prázdná úvodní obrazovka = systémové pozadí; vlastní grafiku sem
        # doplníme, až bude co ukazovat
        UILaunchScreen: {}
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Aplikace mluví s IMAP/SMTP servery po TLS a s API přes HTTPS;
        # výjimka z ATS není potřeba.
        ITSAppUsesNonExemptEncryption: false
        # Návrat z přihlášení k Metě: prohlížeč otevře quentino-mail://ig-oauth
        # a systém odkaz předá aplikaci. Bez tohohle zápisu by se nikam nevrátil.
        CFBundleURLTypes:
          - CFBundleURLName: cz.quentino.app.oauth
            CFBundleURLSchemes:
              - quentino-mail
        # Výběr fotek a videí do příspěvku a do podpisu
        NSPhotoLibraryUsageDescription: >-
          Z knihovny se vybírají fotky a videa pro příspěvky na Instagram
          a přílohy e-mailů. Nic se nikam neposílá bez tvého potvrzení.
        NSCameraUsageDescription: >-
          Vyfocení přílohy nebo obrázku do příspěvku přímo v aplikaci.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIBackgroundModes:
          - fetch
          - processing
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cz.quentino.app
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_BITCODE: "NO"
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
